apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv-analysis-deployment
  labels:
    app: cv-analysis
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cv-analysis
  template:
    metadata:
      labels:
        app: cv-analysis
    spec:
      containers:
        - name: service-container
          image: serv
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
          env:
            - name: APP_MESSAGE
              value: APP_MESSAGE
            - name: AWS_CREDENTIALS_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: cv-analysis-secret
                  key: AWS_CREDENTIALS_ACCESSKEY
            - name: AWS_CREDENTIALS_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: cv-analysis-secret
                  key: AWS_CREDENTIALS_SECRETKEY
            - name: CVISION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cv-analysis-secret
                  key: CVISION_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: cv-analysis-service
spec:
  type: NodePort
  selector:
    app: cv-analysis
  ports:
    - port: 8090
      targetPort: 8090
